<!DOCTYPE html>
<html lang="lo">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ລະບົບບັນທຶກປະຫວັດຄົນເຈັບປະຈຳມື້</title>
    <!-- Font ລາວ ແລະ Tailwind CSS -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Lao:wght@300;400;500;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            font-family: 'Noto Sans Lao', sans-serif;
            background-color: #f3f4f6;
        }
        @media print {
            .no-print { display: none !important; }
            body { background-color: white; }
        }
    </style>
</head>
<body class="p-4 md:p-8">

    <div class="max-w-7xl mx-auto">
        <!-- Header -->
        <div class="bg-white rounded-lg shadow-md p-6 mb-6 flex flex-col md:flex-row justify-between items-center border-l-4 border-blue-600">
            <div>
                <h1 class="text-2xl md:text-3xl font-bold text-gray-800">ລະບົບບັນທຶກປະຫວັດຄົນເຈັບປະຈຳມື້</h1>
                <p class="text-gray-500 text-sm mt-1">Dashboard ຈັດການຂໍ້ມູນ, ເບິ່ງລາຍລະອຽດ, ແກ້ໄຂ ແລະ ບັນທຶກອັດໂນມັດ</p>
            </div>
            <div class="mt-4 md:mt-0 no-print flex gap-2">
                <button onclick="window.print()" class="bg-green-600 hover:bg-green-700 text-white px-4 py-2 rounded-lg flex items-center gap-2 transition">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 17h2a2 2 0 002-2v-4a2 2 0 00-2-2H5a2 2 0 00-2 2v4a2 2 0 002 2h2m2 4h6a2 2 0 002-2v-4a2 2 0 00-2-2H9a2 2 0 00-2 2v4a2 2 0 002 2zm8-12V5a2 2 0 00-2-2H9a2 2 0 00-2 2v4h10z"></path></svg>
                    ພິມ / ບັນທຶກ PDF
                </button>
            </div>
        </div>

        <!-- ຟອມປ້ອນຂໍ້ມູນ (Form) -->
        <div class="bg-white rounded-lg shadow-md p-6 mb-8 no-print">
            <h2 class="text-xl font-bold text-gray-700 mb-4 pb-2 border-b">ປ້ອນຂໍ້ມູນຄົນເຈັບໃໝ່</h2>
            <form id="patientForm" class="grid grid-cols-1 md:grid-cols-3 lg:grid-cols-4 gap-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">ເລກທີ່</label>
                    <input type="text" id="patientId" required class="w-full p-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-blue-500 focus:outline-none" placeholder="P-001">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">ວັນທີ ເດືອນ ປີ</label>
                    <input type="date" id="visitDate" required class="w-full p-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-blue-500 focus:outline-none">
                </div>
                <div class="md:col-span-2">
                    <label class="block text-sm font-medium text-gray-700 mb-1">ຊື່ ແລະ ນາມສະກຸນ</label>
                    <input type="text" id="fullName" required class="w-full p-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-blue-500 focus:outline-none" placeholder="ທ້າວ/ນາງ...">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">ອາຍຸ (ປີ)</label>
                    <input type="number" id="age" required class="w-full p-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-blue-500 focus:outline-none" placeholder="0">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">ເພດ</label>
                    <select id="gender" class="w-full p-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-blue-500 focus:outline-none">
                        <option value="ຊາຍ">ຊາຍ</option>
                        <option value="ຍິງ">ຍິງ</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">ອາຊີບ</label>
                    <input type="text" id="occupation" class="w-full p-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-blue-500 focus:outline-none">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">ຄວາມດັນ (mmHg)</label>
                    <input type="text" id="bloodPressure" class="w-full p-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-blue-500 focus:outline-none" placeholder="120/80">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">ບ້ານ</label>
                    <input type="text" id="village" class="w-full p-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-blue-500 focus:outline-none">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">ເມືອງ</label>
                    <input type="text" id="district" class="w-full p-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-blue-500 focus:outline-none">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">ແຂວງ</label>
                    <input type="text" id="province" class="w-full p-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-blue-500 focus:outline-none">
                </div>
                <div class="md:col-span-2">
                    <label class="block text-sm font-medium text-gray-700 mb-1">ບົ່ງມະຕິພະຍາດ</label>
                    <input type="text" id="diagnosis" class="w-full p-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-blue-500 focus:outline-none">
                </div>
                <div class="md:col-span-2 lg:col-span-4">
                    <label class="block text-sm font-medium text-gray-700 mb-1">ແຜນປິ່ນປົວ</label>
                    <textarea id="treatment" rows="2" class="w-full p-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-blue-500 focus:outline-none"></textarea>
                </div>
                <div class="md:col-span-3 lg:col-span-4 flex justify-end">
                    <button type="submit" class="bg-blue-600 hover:bg-blue-700 text-white font-medium px-6 py-2 rounded-md shadow transition">
                        + ບັນທຶກຂໍ້ມູນ
                    </button>
                </div>
            </form>
        </div>

        <!-- ຕາຕະລາງສະແດງຜົນ (Table) -->
        <div class="bg-white rounded-lg shadow-md overflow-hidden">
            <div class="p-4 bg-gray-50 border-b flex justify-between items-center">
                <h3 class="font-bold text-gray-700 text-lg">ລາຍຊື່ຄົນເຈັບ (ຄລິກຊື່ເພື່ອເບິ່ງລາຍລະອຽດ)</h3>
                <span id="totalPatients" class="bg-blue-100 text-blue-800 text-xs font-semibold px-2.5 py-0.5 rounded-full">ທັງໝົດ: 0 ຄົນ</span>
            </div>
            <div class="overflow-x-auto">
                <table class="w-full text-sm text-left text-gray-600">
                    <thead class="text-xs text-gray-700 uppercase bg-gray-100 border-b">
                        <tr>
                            <th class="py-3 px-4">ເລກທີ່</th>
                            <th class="py-3 px-4">ວັນທີ</th>
                            <th class="py-3 px-4">ຊື່ຄົນເຈັບ</th>
                            <th class="py-3 px-4">ອາຍຸ/ເພດ</th>
                            <th class="py-3 px-4">ຄວາມດັນ</th>
                            <th class="py-3 px-4">ບົ່ງມະຕິພະຍາດ</th>
                            <th class="py-3 px-4 text-center no-print">ຈັດການ</th>
                        </tr>
                    </thead>
                    <tbody id="patientTableBody">
                        <!-- ຂໍ້ມູນຈະສະແດງຢູ່ບ່ອນນີ້ -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Pop-up Modal ສຳລັບເບິ່ງລາຍລະອຽດ ແລະ ແກ້ໄຂ -->
    <div id="detailModal" class="fixed inset-0 bg-black bg-opacity-50 hidden flex justify-center items-center p-4 z-50 no-print">
        <div class="bg-white rounded-lg shadow-xl w-full max-w-2xl max-h-[90vh] overflow-y-auto">
            <div class="p-4 border-b bg-blue-600 text-white flex justify-between items-center rounded-t-lg">
                <h3 class="font-bold text-lg">ລາຍລະອຽດຂໍ້ມູນຄົນເຈັບ</h3>
                <button onclick="closeModal()" class="text-white hover:text-gray-200 font-bold text-xl">&times;</button>
            </div>
            
            <form id="editForm" class="p-6 grid grid-cols-1 md:grid-cols-2 gap-4">
                <input type="hidden" id="editIndex">
                <div>
                    <label class="block text-xs font-semibold text-gray-500 uppercase">ເລກທີ່</label>
                    <input type="text" id="editId" required class="w-full p-2 border rounded mt-1 bg-gray-50">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-gray-500 uppercase">ວັນທີ</label>
                    <input type="date" id="editDate" required class="w-full p-2 border rounded mt-1">
                </div>
                <div class="md:col-span-2">
                    <label class="block text-xs font-semibold text-gray-500 uppercase">ຊື່ ແລະ ນາມສະກຸນ</label>
                    <input type="text" id="editName" required class="w-full p-2 border rounded mt-1 font-bold text-gray-800">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-gray-500 uppercase">ອາຍຸ</label>
                    <input type="number" id="editAge" required class="w-full p-2 border rounded mt-1">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-gray-500 uppercase">ເພດ</label>
                    <select id="editGender" class="w-full p-2 border rounded mt-1">
                        <option value="ຊາຍ">ຊາຍ</option>
                        <option value="ຍິງ">ຍິງ</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-gray-500 uppercase">ອາຊີບ</label>
                    <input type="text" id="editOccupation" class="w-full p-2 border rounded mt-1">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-gray-500 uppercase">ຄວາມດັນ (mmHg)</label>
                    <input type="text" id="editBp" class="w-full p-2 border rounded mt-1 text-blue-600 font-bold">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-gray-500 uppercase">ບ້ານ</label>
                    <input type="text" id="editVillage" class="w-full p-2 border rounded mt-1">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-gray-500 uppercase">ເມືອງ</label>
                    <input type="text" id="editDistrict" class="w-full p-2 border rounded mt-1">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-gray-500 uppercase">ແຂວງ</label>
                    <input type="text" id="editProvince" class="w-full p-2 border rounded mt-1">
                </div>
                <div class="md:col-span-2">
                    <label class="block text-xs font-semibold text-gray-500 uppercase">ບົ່ງມະຕິພະຍາດ</label>
                    <input type="text" id="editDiagnosis" class="w-full p-2 border rounded mt-1">
                </div>
                <div class="md:col-span-2">
                    <label class="block text-xs font-semibold text-gray-500 uppercase">ແຜນປິ່ນປົວ</label>
                    <textarea id="editTreatment" rows="3" class="w-full p-2 border rounded mt-1"></textarea>
                </div>
                
                <div class="md:col-span-2 flex justify-end gap-2 border-t pt-4 mt-2">
                    <button type="button" onclick="closeModal()" class="px-4 py-2 bg-gray-300 text-gray-700 rounded-md hover:bg-gray-400">ຍົກເລີກ</button>
                    <button type="submit" class="px-4 py-2 bg-yellow-500 hover:bg-yellow-600 text-white rounded-md shadow">ບັນທຶກການແກ້ໄຂ</button>
                </div>
            </form>
        </div>
    </div>

    <!-- JavaScript ຈັດການ Logic, Auto Save ແລະ Modal -->
    <script>
        document.getElementById('visitDate').valueAsDate = new Date();

        // ດຶງຂໍ້ມູນຈາກ LocalStorage (Auto Save)
        let patients = JSON.parse(localStorage.getItem('patients_data')) || [];

        const form = document.getElementById('patientForm');
        const editForm = document.getElementById('editForm');
        const tableBody = document.getElementById('patientTableBody');
        const totalPatientsSpan = document.getElementById('totalPatients');
        const modal = document.getElementById('detailModal');

        // ຟັງຊັນບັນທຶກຂໍ້ມູນລົງ LocalStorage ອັດໂນມັດ
        function saveToLocalStorage() {
            localStorage.setItem('patients_data', JSON.stringify(patients));
            renderTable();
        }

        // ເພີ່ມຂໍ້ມູນໃໝ່
        form.addEventListener('submit', function(e) {
            e.preventDefault();
            const patient = {
                id: document.getElementById('patientId').value,
                date: document.getElementById('visitDate').value,
                name: document.getElementById('fullName').value,
                age: document.getElementById('age').value,
                gender: document.getElementById('gender').value,
                occupation: document.getElementById('occupation').value,
                bp: document.getElementById('bloodPressure').value,
                village: document.getElementById('village').value,
                district: document.getElementById('district').value,
                province: document.getElementById('province').value,
                diagnosis: document.getElementById('diagnosis').value,
                treatment: document.getElementById('treatment').value
            };

            patients.push(patient);
            saveToLocalStorage();
            form.reset();
            document.getElementById('visitDate').valueAsDate = new Date();
        });

        // ສະແດງຂໍ້ມູນໃນຕາຕະລາງ
        function renderTable() {
            tableBody.innerHTML = '';

            if (patients.length === 0) {
                tableBody.innerHTML = `<tr><td colspan="7" class="text-center py-6 text-gray-400">ບໍ່ມີຂໍ້ມູນຄົນເຈັບ</td></tr>`;
            } else {
                patients.forEach((p, index) => {
                    const row = document.createElement('tr');
                    row.className = 'border-b hover:bg-gray-50';
                    row.innerHTML = `
                        <td class="py-3 px-4 font-semibold text-gray-800">${p.id}</td>
                        <td class="py-3 px-4 whitespace-nowrap">${p.date}</td>
                        <td class="py-3 px-4 font-medium text-blue-600 hover:underline cursor-pointer whitespace-nowrap" onclick="openModal(${index})">
                            ${p.name} 🔍
                        </td>
                        <td class="py-3 px-4 whitespace-nowrap">${p.age} ປີ / ${p.gender}</td>
                        <td class="py-3 px-4 font-medium text-blue-600 whitespace-nowrap">${p.bp || '-'}</td>
                        <td class="py-3 px-4">${p.diagnosis || '-'}</td>
                        <td class="py-3 px-4 text-center no-print flex justify-center gap-2">
                            <button onclick="openModal(${index})" class="text-yellow-600 hover:text-yellow-800 font-medium text-xs bg-yellow-50 hover:bg-yellow-100 px-2 py-1 rounded">ເບິ່ງ/ແກ້ໄຂ</button>
                            <button onclick="deletePatient(${index})" class="text-red-600 hover:text-red-800 font-medium text-xs bg-red-50 hover:bg-red-100 px-2 py-1 rounded">ລົບ</button>
                        </td>
                    `;
                    tableBody.appendChild(row);
                });
            }
            totalPatientsSpan.innerText = `ທັງໝົດ: ${patients.length} ຄົນ`;
        }

        // ເປີດ Modal ສະແດງ ແລະ ແກ້ໄຂ
        function openModal(index) {
            const p = patients[index];
            document.getElementById('editIndex').value = index;
            document.getElementById('editId').value = p.id;
            document.getElementById('editDate').value = p.date;
            document.getElementById('editName').value = p.name;
            document.getElementById('editAge').value = p.age;
            document.getElementById('editGender').value = p.gender;
            document.getElementById('editOccupation').value = p.occupation;
            document.getElementById('editBp').value = p.bp;
            document.getElementById('editVillage').value = p.village;
            document.getElementById('editDistrict').value = p.district;
            document.getElementById('editProvince').value = p.province;
            document.getElementById('editDiagnosis').value = p.diagnosis;
            document.getElementById('editTreatment').value = p.treatment;

            modal.classList.remove('hidden');
        }

        // ປິດ Modal
        function closeModal() {
            modal.classList.add('hidden');
        }

        // ບັນທຶກການແກ້ໄຂ (Save Edit)
        editForm.addEventListener('submit', function(e) {
            e.preventDefault();
            const index = document.getElementById('editIndex').value;

            patients[index] = {
                id: document.getElementById('editId').value,
                date: document.getElementById('editDate').value,
                name: document.getElementById('editName').value,
                age: document.getElementById('editAge').value,
                gender: document.getElementById('editGender').value,
                occupation: document.getElementById('editOccupation').value,
                bp: document.getElementById('editBp').value,
                village: document.getElementById('editVillage').value,
                district: document.getElementById('editDistrict').value,
                province: document.getElementById('editProvince').value,
                diagnosis: document.getElementById('editDiagnosis').value,
                treatment: document.getElementById('editTreatment').value
            };

            saveToLocalStorage();
            closeModal();
        });

        // ລົບຂໍ້ມູນ
        function deletePatient(index) {
            if (confirm('ທ່ານຕ້ອງການລົບຂໍ້ມູນຄົນເຈັບນີ້ແທ້ບໍ?')) {
                patients.splice(index, 1);
                saveToLocalStorage();
            }
        }

        // Render ທຳອິດເມື່ອໂຫຼດໜ້າເວັບ
        renderTable();
    </script>
</body>
</html>
