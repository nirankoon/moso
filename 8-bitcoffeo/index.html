<!DOCTYPE html>
<html lang="lo">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>8-Bit Coffeo</title>
  <link rel="manifest" href="data:application/json,{
    %22name%22:%228-Bit%20Coffeo%22,
    %22short_name%22:%228BitCoffeo%22,
    %22start_url%22:%22.%22,
    %22display%22:%22standalone%22,
    %22background_color%22:%22%23F5EBE0%22,
    %22theme_color%22:%22%238D5B4C%22
  }">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Noto+Sans+Lao:wght@600;800&display=swap');

    :root {
      --bg: #F5EBE0;
      --card-bg: #E3D5CA;
      --border: #4A3B32;
      --primary: #8D5B4C;
      --accent: #D5BDAF;
      --text: #2B1E1A;
      --shadow: #8D7B68;
      --tag-bg: #D6EAF8;
      --tag-border: #2980B9;
      --tag-text: #1B4F72;
    }

    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      font-family: 'Noto Sans Lao', 'Press Start 2P', monospace;
    }

    html, body {
      background-color: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 0;
      font-size: 14px;
      width: 100%;
      height: 100%;
      overflow-x: hidden;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      scroll-behavior: smooth;
    }

    body {
      padding: 12px;
      padding-bottom: 40px;
    }

    /* Background Pixel Particles */
    #particleCanvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      z-index: 0;
      opacity: 0.5;
    }

    .app-container {
      position: relative;
      z-index: 1;
      max-width: 650px;
      margin: 0 auto;
    }

    /* Header Styling */
    .header-box {
      background: var(--card-bg);
      border: 4px solid var(--border);
      box-shadow: 4px 4px 0 var(--border);
      padding: 12px;
      text-align: center;
      margin-bottom: 10px;
      position: relative;
    }

    h1 {
      font-size: 18px;
      margin: 0 0 8px 0;
      color: var(--primary);
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .sub-info {
      font-size: 11px;
      line-height: 1.5;
    }

    .top-actions {
      position: absolute;
      top: 8px;
      right: 8px;
      display: flex;
      gap: 6px;
    }

    .icon-btn {
      background: var(--bg);
      border: 2px solid var(--border);
      font-size: 12px;
      width: 28px;
      height: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 2px 2px 0 var(--border);
    }

    .icon-btn:active {
      transform: translate(1px, 1px);
      box-shadow: 1px 1px 0 var(--border);
    }

    /* WhatsApp Button */
    .whatsapp-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      width: 100%;
      background: #25D366;
      color: #FFF;
      border: 3px solid var(--border);
      box-shadow: 3px 3px 0 var(--border);
      padding: 10px;
      font-weight: bold;
      font-size: 12px;
      text-decoration: none;
      margin-bottom: 12px;
      transition: transform 0.1s ease;
    }

    .whatsapp-btn:active {
      transform: translate(2px, 2px);
      box-shadow: 1px 1px 0 var(--border);
    }

    /* Controls & Search */
    .controls {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 12px;
    }

    .search-input {
      width: 100%;
      background: #FFF;
      border: 3px solid var(--border);
      padding: 8px 12px;
      font-size: 12px;
      box-shadow: 3px 3px 0 var(--border);
      outline: none;
    }

    .btn {
      background: var(--card-bg);
      border: 3px solid var(--border);
      box-shadow: 3px 3px 0 var(--border);
      padding: 8px 4px;
      font-weight: bold;
      font-size: 11px;
      text-align: center;
      color: var(--text);
      cursor: pointer;
      transition: transform 0.1s ease;
    }

    .btn:active {
      transform: translate(2px, 2px);
      box-shadow: 1px 1px 0 var(--border);
    }

    .add-btn {
      background: #A3E4D7;
      font-size: 12px;
    }

    /* Sector Hashtag Filter Chips Bar */
    .hashtag-bar {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      padding-bottom: 6px;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
    }

    .hashtag-bar::-webkit-scrollbar {
      display: none;
    }

    .hashtag-chip {
      background: var(--card-bg);
      border: 2px solid var(--border);
      padding: 5px 9px;
      font-size: 10px;
      font-weight: bold;
      cursor: pointer;
      white-space: nowrap;
      box-shadow: 2px 2px 0 var(--border);
      color: var(--text);
    }

    .hashtag-chip.active {
      background: var(--primary);
      color: #FFF;
      transform: translate(1px, 1px);
      box-shadow: 1px 1px 0 var(--border);
    }

    /* Cards Grid */
    .member-grid {
      display: grid;
      grid-template-columns: repeat( auto-fit, minmax(115px, 1fr) );
      gap: 10px;
    }

    .card {
      background: var(--card-bg);
      border: 3px solid var(--border);
      box-shadow: 3px 3px 0 var(--border);
      padding: 8px;
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
      touch-action: manipulation;
      transition: transform 0.1s ease, box-shadow 0.1s ease;
      animation: spawnAnim 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .card:active {
      transform: scale(0.96);
    }

    .card.holding {
      animation: pulseHold 0.35s infinite alternate ease-in-out;
      border-color: #D35400;
    }

    .card.removing {
      animation: removeAnim 0.25s forwards ease-in;
    }

    @keyframes spawnAnim {
      0% { transform: scale(0) rotate(-4deg); opacity: 0; }
      100% { transform: scale(1) rotate(0deg); opacity: 1; }
    }

    @keyframes pulseHold {
      0% { transform: scale(0.96) rotate(-2deg); }
      100% { transform: scale(1.03) rotate(2deg); }
    }

    @keyframes removeAnim {
      0% { transform: scale(1); opacity: 1; }
      100% { transform: scale(0) rotate(10deg); opacity: 0; }
    }

    .badge-icon {
      position: absolute;
      top: 4px;
      right: 4px;
      font-size: 14px;
    }

    .avatar {
      width: 52px;
      height: 52px;
      border: 2px solid var(--border);
      background: #FFF;
      image-rendering: pixelated;
      margin-bottom: 4px;
      pointer-events: none;
    }

    .member-num {
      font-size: 9px;
      color: var(--primary);
      font-weight: bold;
    }

    .member-name {
      font-size: 11px;
      font-weight: bold;
      text-align: center;
      word-break: break-word;
      margin-top: 2px;
    }

    /* Hashtags inside card */
    .card-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 3px;
      justify-content: center;
      margin-top: 6px;
      width: 100%;
    }

    .tag-mini {
      background: var(--tag-bg);
      border: 1px solid var(--tag-border);
      color: var(--tag-text);
      font-size: 8px;
      font-weight: bold;
      padding: 1px 4px;
      border-radius: 2px;
      white-space: nowrap;
    }

    /* Modal Layout */
    .modal-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.65);
      z-index: 99;
      justify-content: center;
      align-items: center;
      padding: 16px;
      backdrop-filter: blur(2px);
    }

    .modal-overlay.active {
      display: flex;
    }

    .modal {
      background: var(--bg);
      border: 4px solid var(--border);
      box-shadow: 6px 6px 0 var(--border);
      width: 100%;
      max-width: 380px;
      max-height: 90vh;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      animation: spawnAnim 0.2s ease-out;
    }

    .modal h2 {
      margin: 0;
      font-size: 15px;
      text-align: center;
      color: var(--primary);
    }

    .modal label {
      font-size: 10px;
      font-weight: bold;
      margin-top: 4px;
    }

    .modal input, .modal textarea, .modal select {
      width: 100%;
      background: #FFF;
      border: 2px solid var(--border);
      padding: 8px;
      font-size: 12px;
      outline: none;
    }

    .action-row {
      display: flex;
      gap: 6px;
      justify-content: space-around;
    }

    .reaction-btn {
      font-size: 20px;
      padding: 6px 10px;
      border: 2px solid var(--border);
      background: var(--card-bg);
      cursor: pointer;
    }

    .reaction-btn:active {
      transform: scale(1.15);
    }

    /* Screen-Aware Floating Reaction Bar */
    .reaction-overlay {
      display: none;
      position: fixed;
      z-index: 100;
      background: var(--card-bg);
      border: 3px solid var(--border);
      box-shadow: 4px 4px 0 var(--border);
      padding: 6px;
      gap: 6px;
      animation: spawnAnim 0.18s ease-out;
    }

    .reaction-overlay.active {
      display: flex;
    }
  </style>

  <!-- AUTO-GENERATED PWA METADATA BY MOSO -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0284c7">

  <link rel="icon" type="image/png" href="https://img.icons8.com/color/512/rocket.png">
  <link rel="apple-touch-icon" href="https://img.icons8.com/color/512/rocket.png">

</head>
<body>

  <canvas id="particleCanvas"></canvas>

  <div class="app-container">
    <div class="header-box">
      <div class="top-actions">
        <button class="icon-btn" title="Export Data" onclick="exportData()">💾</button>
        <button class="icon-btn" title="Import Data" onclick="triggerImport()">📂</button>
      </div>
      <h1>☕ 8-Bit Coffeo</h1>
      <div class="sub-info">
        📅 20-9-2026 | 📍 Phordee Cafe<br>
        ⚜️ ຫົວຂໍ້: ແລກປ່ຽນບັນຫາທຸລະກິດ
      </div>
    </div>

    <!-- Direct WhatsApp Button -->
    <a href="https://chat.whatsapp.com/LRSD5mpQqkg9h2YRviw28N?s=qs&p=i&mlu=4&amv=2" target="_blank" class="whatsapp-btn">
      💬 OPEN WHATSAPP GROUP
    </a>

    <input type="file" id="importFileInput" accept=".json" style="display:none;" onchange="importData(event)">

    <!-- Controls, Search & Hashtag Filtering -->
    <div class="controls">
      <input type="text" id="searchInput" class="search-input" placeholder="🔍 Search name, sector, or #hashtag..." oninput="render()">

      <button class="btn add-btn" onclick="openAddModal()">+ ADD MEMBER</button>

      <!-- Dynamic Hashtag Filter Bar -->
      <div class="hashtag-bar" id="hashtagFilterBar"></div>
    </div>

    <div class="member-grid" id="memberGrid"></div>
  </div>

  <!-- Screen-Aware Quick Status Overlay -->
  <div class="reaction-overlay" id="reactionOverlay">
    <span class="reaction-btn" onclick="setQuickStatus('⭐')">⭐</span>
    <span class="reaction-btn" onclick="setQuickStatus('❤️')">❤️</span>
    <span class="reaction-btn" onclick="setQuickStatus('👍')">👍</span>
    <span class="reaction-btn" onclick="setQuickStatus('👀')">👀</span>
    <span class="reaction-btn" onclick="setQuickStatus('')">❌</span>
  </div>

  <div class="modal-overlay" id="modalOverlay">
    <div class="modal">
      <h2 id="modalTitle">EDIT MEMBER</h2>
      <input type="hidden" id="editIndex">
      
      <label>Name:</label>
      <input type="text" id="editName" placeholder="Name">

      <label>Avatar Gender:</label>
      <select id="editGender">
        <option value="male">👨 Male Pixel</option>
        <option value="female">👩 Female Pixel</option>
        <option value="random">🎲 Random Sprite</option>
      </select>
      
      <label>Business Hashtags (Comma/Space separated):</label>
      <input type="text" id="editHashtags" placeholder="#CoffeeShop #SoftwareApp #RealEstate">

      <label>Phone Number:</label>
      <input type="tel" id="editPhone" placeholder="+856 20...">
      
      <label>Social / WhatsApp Link:</label>
      <input type="text" id="editLink" placeholder="https://...">

      <label>Status Tag:</label>
      <div class="action-row">
        <button class="reaction-btn" onclick="selectStatus('⭐')">⭐</button>
        <button class="reaction-btn" onclick="selectStatus('❤️')">❤️</button>
        <button class="reaction-btn" onclick="selectStatus('👍')">👍</button>
        <button class="reaction-btn" onclick="selectStatus('👀')">👀</button>
      </div>

      <label>Rearrange Position:</label>
      <div class="action-row">
        <button class="btn" style="flex:1;" onclick="movePosition('UP')">⬆ UP</button>
        <button class="btn" style="flex:1;" onclick="movePosition('DOWN')">⬇ DOWN</button>
        <button class="btn" style="flex:1; background:#FCF3CF;" onclick="movePosition('TOP')">🔝 TOP</button>
      </div>

      <label>Notes / Business Sector Details:</label>
      <textarea id="editNotes" rows="2" placeholder="Notes on coffee brand, software startup, property..."></textarea>

      <div style="display:flex; gap:6px; margin-top:8px;">
        <button class="btn" style="background:#FADBD8" onclick="deleteMember()">DELETE</button>
        <button class="btn" onclick="closeModal()">CANCEL</button>
        <button class="btn" style="background:#A9DFBF" onclick="saveMember()">SAVE</button>
      </div>
    </div>
  </div>

  <script>
    // Pre-loaded Lao WhatsApp attendees with business hashtags
    const defaultList = [
      { name: "ທຽນ", gender: "male", tags: ["#CoffeeShop", "#Retail"] },
      { name: "ຄຳສອນ", gender: "male", tags: ["#RealEstate", "#Finance"] },
      { name: "ວົງ", gender: "male", tags: ["#SoftwareApp", "#Tech"] },
      { name: "ນູ່", gender: "female", tags: ["#Design", "#Marketing"] },
      { name: "ນ້ອຍ", gender: "female", tags: ["#CoffeeShop", "#Bakery"] },
      { name: "ສັກ", gender: "male", tags: ["#Logistics", "#Import"] },
      { name: "ນ້າ", gender: "female", tags: ["#Consulting", "#HR"] },
      { name: "ບຸ້ຍ", gender: "male", tags: ["#RealEstate", "#Construction"] },
      { name: "ໂຊ້", gender: "male", tags: ["#SoftwareApp", "#ECommerce"] },
      { name: "ຮຸ່ຍ", gender: "male", tags: ["#Finance", "#Investment"] },
      { name: "แม่ทพย์", gender: "female", tags: ["#Restaurant", "#F&B"] },
      { name: "ນໍ້າເຜິ້ງ", gender: "female", tags: ["#Beauty", "#Retail"] },
      { name: "ເຢຍ", gender: "male", tags: ["#Agriculture", "#Export"] },
      { name: "ສົມໄຈ", gender: "male", tags: ["#CarRental", "#Tourism"] },
      { name: "ເລ້", gender: "male", tags: ["#CoffeeShop", "#Roastery"] },
      { name: "ສົມພອນ", gender: "male", tags: ["#RealEstate", "#Hotel"] },
      { name: "ຕູ່", gender: "female", tags: ["#Marketing", "#Media"] },
      { name: "ແອ", gender: "female", tags: ["#Education", "#Training"] },
      { name: "ປາຍ", gender: "female", tags: ["#Design", "#Fashion"] },
      { name: "ໂບ", gender: "female", tags: ["#Event", "#PR"] },
      { name: "ມ່ອງ", gender: "male", tags: ["#SoftwareApp", "#AI"] },
      { name: "ໄກສອນ", gender: "male", tags: ["#Lawyer", "#Legal"] },
      { name: "ກຽດສຸວັນ", gender: "male", tags: ["#Finance", "#Banking"] },
      { name: "ສົມັຍິງ", gender: "female", tags: ["#Health", "#Pharmacy"] },
      { name: "ອິມ ຂໍເຂົ້າຮ່ວມນຳ", gender: "female", tags: ["#Startup", "#Retail"] },
      { name: "leygodlike", gender: "male", tags: ["#Gaming", "#SoftwareApp"] },
      { name: "dola", gender: "male", tags: ["#Trading", "#Import"] },
      { name: "ແຄັດຕີ້", gender: "female", tags: ["#CoffeeShop", "#Studio"] }
    ];

    let members = [];
    let activeHashtag = 'ALL';
    let holdTimer = null;
    let selectedMemberIndex = null;
    let isLongPressTriggered = false;

    // Ambient Particles Canvas Animation
    const canvas = document.getElementById('particleCanvas');
    const ctx = canvas.getContext('2d');
    let particles = [];

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    class PixelParticle {
      constructor() {
        this.x = Math.random() * canvas.width;
        this.y = Math.random() * canvas.height;
        this.size = Math.floor(Math.random() * 3) + 2;
        this.speedY = -(Math.random() * 0.35 + 0.1);
        this.opacity = Math.random() * 0.4 + 0.2;
      }
      update() {
        this.y += this.speedY;
        if (this.y < -10) {
          this.y = canvas.height + 10;
          this.x = Math.random() * canvas.width;
        }
      }
      draw() {
        ctx.fillStyle = `rgba(141, 91, 76, ${this.opacity})`;
        ctx.fillRect(this.x, this.y, this.size, this.size);
      }
    }

    for (let i = 0; i < 25; i++) particles.push(new PixelParticle());

    function animateParticles() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      particles.forEach(p => { p.update(); p.draw(); });
      requestAnimationFrame(animateParticles);
    }
    animateParticles();

    // Data Management
    function initData() {
      const localData = localStorage.getItem('coffeo_members_hashtags');
      if (localData) {
        members = JSON.parse(localData);
      } else {
        members = defaultList.map((item, idx) => ({
          id: idx + 1,
          name: item.name,
          gender: item.gender,
          hashtags: item.tags,
          phone: '',
          link: '',
          notes: '',
          status: '',
          avatar: generateAvatar(item.name, item.gender)
        }));
        saveToLocal();
      }
      renderHashtagBar();
      render();
    }

    function generateAvatar(seedName, gender) {
      const style = (gender === 'female') ? 'pixel-art-neutral' : (gender === 'male' ? 'pixel-art' : 'bottts');
      return `https://api.dicebear.com/7.x/${style}/svg?seed=${encodeURIComponent(seedName)}`;
    }

    function saveToLocal() {
      localStorage.setItem('coffeo_members_hashtags', JSON.stringify(members));
      renderHashtagBar();
    }

    function exportData() {
      const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(members, null, 2));
      const anchor = document.createElement('a');
      anchor.setAttribute("href", dataStr);
      anchor.setAttribute("download", `8bit_coffeo_backup_${new Date().toISOString().slice(0,10)}.json`);
      document.body.appendChild(anchor);
      anchor.click();
      anchor.remove();
    }

    function triggerImport() {
      document.getElementById('importFileInput').click();
    }

    function importData(event) {
      const file = event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(e) {
        try {
          const imported = JSON.parse(e.target.result);
          if (Array.isArray(imported)) {
            members = imported;
            saveToLocal();
            render();
            alert('Import successful!');
          }
        } catch (err) {
          alert('Failed to parse backup file!');
        }
      };
      reader.readAsText(file);
      event.target.value = '';
    }

    // Dynamic Hashtag Filter Bar
    function renderHashtagBar() {
      const bar = document.getElementById('hashtagFilterBar');
      const tagMap = new Map();

      members.forEach(m => {
        if (m.hashtags) {
          m.hashtags.forEach(tag => {
            const formatted = tag.startsWith('#') ? tag : `#${tag}`;
            tagMap.set(formatted, (tagMap.get(formatted) || 0) + 1);
          });
        }
      });

      let html = `<div class="hashtag-chip ${activeHashtag === 'ALL' ? 'active' : ''}" onclick="setHashtagFilter('ALL')">ALL</div>`;
      tagMap.forEach((count, tag) => {
        html += `<div class="hashtag-chip ${activeHashtag === tag ? 'active' : ''}" onclick="setHashtagFilter('${tag}')">${tag} (${count})</div>`;
      });

      bar.innerHTML = html;
    }

    function setHashtagFilter(tag) {
      activeHashtag = tag;
      renderHashtagBar();
      render();
    }

    // Main Card Grid Render Logic
    function render() {
      const grid = document.getElementById('memberGrid');
      const searchVal = document.getElementById('searchInput').value.toLowerCase().trim();
      grid.innerHTML = '';

      members.forEach((m, index) => {
        // Filter by hashtag chip
        if (activeHashtag !== 'ALL' && (!m.hashtags || !m.hashtags.includes(activeHashtag))) {
          return;
        }

        // Filter by Search Query (Name, Sector, Hashtags)
        if (searchVal) {
          const matchName = m.name.toLowerCase().includes(searchVal);
          const matchNotes = (m.notes || '').toLowerCase().includes(searchVal);
          const matchTags = (m.hashtags || []).some(t => t.toLowerCase().includes(searchVal));
          if (!matchName && !matchNotes && !matchTags) return;
        }

        const card = document.createElement('div');
        card.className = 'card';

        const tagsHtml = (m.hashtags || []).map(t => `<span class="tag-mini">${t}</span>`).join('');

        card.innerHTML = `
          <div class="badge-icon">${m.status || ''}</div>
          <img class="avatar" src="${m.avatar}" alt="pixel-art">
          <div class="member-num">#${index + 1}</div>
          <div class="member-name">${m.name}</div>
          <div class="card-tags">${tagsHtml}</div>
        `;

        // Touch & Hold Logic
        card.addEventListener('touchstart', (e) => {
          isLongPressTriggered = false;
          selectedMemberIndex = index;
          card.classList.add('holding');
          holdTimer = setTimeout(() => {
            isLongPressTriggered = true;
            card.classList.remove('holding');
            showScreenAwareReactionOverlay(e);
          }, 420);
        }, {passive: true});

        card.addEventListener('touchend', () => {
          clearTimeout(holdTimer);
          card.classList.remove('holding');
        });

        card.addEventListener('touchmove', () => {
          clearTimeout(holdTimer);
          card.classList.remove('holding');
        });

        // Click event for Mobile Tap and Desktop Click
        card.addEventListener('click', () => {
          if (!isLongPressTriggered) {
            openEditModal(index);
          }
          isLongPressTriggered = false;
        });

        grid.appendChild(card);
      });
    }

    // Screen-Aware Position Logic for Tap & Hold Reaction Popup
    function showScreenAwareReactionOverlay(e) {
      const overlay = document.getElementById('reactionOverlay');
      overlay.classList.add('active');

      const touch = e.touches ? e.touches[0] : e;
      const overlayWidth = 210;
      let leftPos = touch.clientX - (overlayWidth / 2);
      let topPos = touch.clientY - 60;

      if (leftPos < 10) leftPos = 10;
      if (leftPos + overlayWidth > window.innerWidth - 10) {
        leftPos = window.innerWidth - overlayWidth - 10;
      }
      if (topPos < 10) topPos = touch.clientY + 20;

      overlay.style.top = `${topPos}px`;
      overlay.style.left = `${leftPos}px`;
    }

    function setQuickStatus(statusIcon) {
      if (selectedMemberIndex !== null) {
        members[selectedMemberIndex].status = statusIcon;
        saveToLocal();
        render();
      }
      document.getElementById('reactionOverlay').classList.remove('active');
    }

    // Modal Handlers
    function openEditModal(index) {
      selectedMemberIndex = index;
      const m = members[index];
      document.getElementById('editIndex').value = index;
      document.getElementById('editName').value = m.name;
      document.getElementById('editGender').value = m.gender || 'male';
      document.getElementById('editHashtags').value = (m.hashtags || []).join(' ');
      document.getElementById('editPhone').value = m.phone || '';
      document.getElementById('editLink').value = m.link || '';
      document.getElementById('editNotes').value = m.notes || '';
      document.getElementById('modalTitle').innerText = `EDIT MEMBER #${index + 1}`;
      document.getElementById('modalOverlay').classList.add('active');
    }

    function openAddModal() {
      selectedMemberIndex = null;
      document.getElementById('editIndex').value = '';
      document.getElementById('editName').value = '';
      document.getElementById('editGender').value = 'male';
      document.getElementById('editHashtags').value = '#CoffeeShop';
      document.getElementById('editPhone').value = '';
      document.getElementById('editLink').value = '';
      document.getElementById('editNotes').value = '';
      document.getElementById('modalTitle').innerText = 'ADD NEW MEMBER';
      document.getElementById('modalOverlay').classList.add('active');
    }

    function closeModal() {
      document.getElementById('modalOverlay').classList.remove('active');
    }

    function selectStatus(icon) {
      if (selectedMemberIndex !== null) {
        members[selectedMemberIndex].status = icon;
      }
    }

    function movePosition(direction) {
      if (selectedMemberIndex === null) return;
      const idx = selectedMemberIndex;

      if (direction === 'UP' && idx > 0) {
        const temp = members[idx];
        members[idx] = members[idx - 1];
        members[idx - 1] = temp;
        selectedMemberIndex = idx - 1;
      } else if (direction === 'DOWN' && idx < members.length - 1) {
        const temp = members[idx];
        members[idx] = members[idx + 1];
        members[idx + 1] = temp;
        selectedMemberIndex = idx + 1;
      } else if (direction === 'TOP' && idx > 0) {
        const item = members.splice(idx, 1)[0];
        members.unshift(item);
        selectedMemberIndex = 0;
      }

      saveToLocal();
      render();
      document.getElementById('modalTitle').innerText = `EDIT MEMBER #${selectedMemberIndex + 1}`;
    }

    function saveMember() {
      const name = document.getElementById('editName').value.trim();
      if (!name) return alert('Name is required!');

      const gender = document.getElementById('editGender').value;
      const rawTags = document.getElementById('editHashtags').value;
      const phone = document.getElementById('editPhone').value;
      const link = document.getElementById('editLink').value;
      const notes = document.getElementById('editNotes').value;

      // Parse Hashtags
      const hashtags = rawTags
        .split(/[\s,]+/)
        .filter(t => t.length > 0)
        .map(t => t.startsWith('#') ? t : `#${t}`);

      if (selectedMemberIndex !== null) {
        members[selectedMemberIndex].name = name;
        members[selectedMemberIndex].gender = gender;
        members[selectedMemberIndex].hashtags = hashtags;
        members[selectedMemberIndex].phone = phone;
        members[selectedMemberIndex].link = link;
        members[selectedMemberIndex].notes = notes;
        members[selectedMemberIndex].avatar = generateAvatar(name, gender);
      } else {
        members.push({
          id: members.length + 1,
          name: name,
          gender: gender,
          hashtags: hashtags,
          phone: phone,
          link: link,
          notes: notes,
          status: '',
          avatar: generateAvatar(name, gender)
        });
      }

      saveToLocal();
      closeModal();
      render();
    }

    function deleteMember() {
      if (selectedMemberIndex !== null && confirm('Delete this member?')) {
        const cards = document.querySelectorAll('.card');
        if (cards[selectedMemberIndex]) {
          cards[selectedMemberIndex].classList.add('removing');
          setTimeout(() => {
            members.splice(selectedMemberIndex, 1);
            saveToLocal();
            closeModal();
            render();
          }, 240);
        } else {
          members.splice(selectedMemberIndex, 1);
          saveToLocal();
          closeModal();
          render();
        }
      }
    }

    // Dismiss Reaction Menu on outside touch
    window.addEventListener('touchstart', (e) => {
      if (!e.target.closest('#reactionOverlay') && !e.target.closest('.card')) {
        document.getElementById('reactionOverlay').classList.remove('active');
      }
    });

    initData();
  </script>
</body>
</html>
