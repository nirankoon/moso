<!DOCTYPE html>
<html lang="lo">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>8-Bit Coffeo - Coffee #9</title>
  <link rel="manifest" href="data:application/json,{
    %22name%22:%228-Bit%20Coffeo%22,
    %22short_name%22:%228BitCoffeo%22,
    %22start_url%22:%22.%22,
    %22display%22:%22standalone%22,
    %22background_color%22:%22%23F5EBE0%22,
    %22theme_color%22:%22%238D5B4C%22
  }">
  
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Noto+Sans+Lao:wght@600;800&display=swap');

    :root {
      --bg: #F5EBE0;
      --card-bg: #E3D5CA;
      --border: #4A3B32;
      --primary: #8D5B4C;
      --accent: #D5BDAF;
      --text: #2B1E1A;
      --shadow: #8D7B68;
      --green: #25D366;
      --green-dark: #128C7E;
      --yellow: #FCF3CF;
      --red: #FADBD8;
    }

    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      font-family: 'Noto Sans Lao', 'Press Start 2P', monospace;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 12px;
      font-size: 14px;
      position: relative;
      overflow-x: hidden;
      min-height: 100vh;
    }

    /* Ambient Particle Background Canvas */
    #particleCanvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      z-index: 0;
      opacity: 0.65;
    }

    .app-container {
      position: relative;
      z-index: 1;
      max-width: 600px;
      margin: 0 auto;
    }

    /* Header Layout & Retro Pixel Box */
    .header-box {
      background: var(--card-bg);
      border: 4px solid var(--border);
      box-shadow: 4px 4px 0 var(--border);
      padding: 14px;
      text-align: center;
      margin-bottom: 12px;
      position: relative;
    }

    h1 {
      font-size: 17px;
      margin: 0 0 8px 0;
      color: var(--primary);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .sub-info {
      font-size: 11px;
      line-height: 1.5;
      color: var(--text);
    }

    /* Compact Top Action Buttons */
    .top-actions {
      position: absolute;
      top: 8px;
      right: 8px;
      display: flex;
      gap: 6px;
    }

    .icon-btn {
      background: var(--bg);
      border: 2px solid var(--border);
      font-size: 12px;
      width: 30px;
      height: 30px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 2px 2px 0 var(--border);
      transition: transform 0.1s ease;
    }

    .icon-btn:active {
      transform: translate(1px, 1px);
      box-shadow: 1px 1px 0 var(--border);
    }

    /* WhatsApp Direct Join Button */
    .whatsapp-btn {
      background: var(--green);
      color: #FFF;
      border: 3px solid var(--border);
      box-shadow: 3px 3px 0 var(--border);
      padding: 10px 12px;
      font-weight: bold;
      font-size: 12px;
      text-align: center;
      text-decoration: none;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-top: 10px;
      cursor: pointer;
      transition: transform 0.1s ease, background-color 0.2s ease;
    }

    .whatsapp-btn:active {
      transform: translate(2px, 2px);
      box-shadow: 1px 1px 0 var(--border);
    }

    /* Controls & Filter Bar */
    .controls {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 12px;
    }

    .btn {
      background: var(--card-bg);
      border: 3px solid var(--border);
      box-shadow: 3px 3px 0 var(--border);
      padding: 8px 4px;
      font-weight: bold;
      font-size: 11px;
      text-align: center;
      color: var(--text);
      cursor: pointer;
      transition: transform 0.1s ease, background-color 0.2s ease;
    }

    .btn:active {
      transform: translate(2px, 2px);
      box-shadow: 1px 1px 0 var(--border);
    }

    .add-btn {
      background: #A3E4D7;
      font-size: 12px;
    }

    /* Filter Chips Horizontal Bar */
    .filter-bar {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      padding-bottom: 4px;
      scrollbar-width: none;
    }

    .filter-bar::-webkit-scrollbar {
      display: none;
    }

    .filter-chip {
      background: var(--card-bg);
      border: 2px solid var(--border);
      padding: 6px 10px;
      font-size: 11px;
      font-weight: bold;
      cursor: pointer;
      white-space: nowrap;
      box-shadow: 2px 2px 0 var(--border);
      transition: transform 0.1s ease, background-color 0.2s ease;
    }

    .filter-chip.active {
      background: var(--primary);
      color: #FFF;
      transform: translate(1px, 1px);
      box-shadow: 1px 1px 0 var(--border);
    }

    /* Member Cards Grid */
    .member-grid {
      display: grid;
      grid-template-columns: repeat( auto-fill, minmax(100px, 1fr) );
      gap: 10px;
    }

    /* Pixel Member Card & Animations */
    .card {
      background: var(--card-bg);
      border: 3px solid var(--border);
      box-shadow: 3px 3px 0 var(--border);
      padding: 8px;
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
      transition: transform 0.15s ease, box-shadow 0.15s ease, opacity 0.25s ease;
      animation: spawnAnim 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .card:active {
      transform: scale(0.95);
    }

    .card.holding {
      animation: pulseHold 0.4s infinite alternate ease-in-out;
      border-color: #D35400;
    }

    .card.removing {
      animation: removeAnim 0.3s forwards ease-in;
    }

    @keyframes spawnAnim {
      0% { transform: scale(0) rotate(-5deg); opacity: 0; }
      100% { transform: scale(1) rotate(0deg); opacity: 1; }
    }

    @keyframes pulseHold {
      0% { transform: scale(0.98) rotate(-2deg); }
      100% { transform: scale(1.04) rotate(2deg); }
    }

    @keyframes removeAnim {
      0% { transform: scale(1); opacity: 1; }
      100% { transform: scale(0) rotate(15deg); opacity: 0; }
    }

    .badge-icon {
      position: absolute;
      top: 4px;
      right: 4px;
      font-size: 14px;
    }

    .avatar {
      width: 56px;
      height: 56px;
      border: 2px solid var(--border);
      background: #FFF;
      image-rendering: pixelated;
      margin-bottom: 6px;
      pointer-events: none;
    }

    .member-num {
      font-size: 10px;
      color: var(--primary);
      font-weight: bold;
    }

    .member-name {
      font-size: 12px;
      font-weight: bold;
      text-align: center;
      word-break: break-word;
      margin-top: 2px;
    }

    /* Modal Styling */
    .modal-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.6);
      z-index: 99;
      justify-content: center;
      align-items: center;
      padding: 16px;
      backdrop-filter: blur(2px);
    }

    .modal-overlay.active {
      display: flex;
    }

    .modal {
      background: var(--bg);
      border: 4px solid var(--border);
      box-shadow: 6px 6px 0 var(--border);
      width: 100%;
      max-width: 360px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      animation: spawnAnim 0.25s ease-out;
    }

    .modal h2 {
      margin: 0;
      font-size: 15px;
      text-align: center;
      color: var(--primary);
    }

    .modal label {
      font-size: 11px;
      font-weight: bold;
      margin-top: 4px;
    }

    .modal input, .modal textarea {
      width: 100%;
      background: #FFF;
      border: 2px solid var(--border);
      padding: 8px;
      font-size: 12px;
      outline: none;
    }

    .action-row {
      display: flex;
      gap: 8px;
      justify-content: space-around;
      margin: 4px 0;
    }

    .reaction-btn {
      font-size: 20px;
      padding: 6px 12px;
      border: 2px solid var(--border);
      background: var(--card-bg);
      cursor: pointer;
      transition: transform 0.1s ease;
    }

    .reaction-btn:active {
      transform: scale(1.2);
    }

    .reaction-overlay {
      display: none;
      position: fixed;
      z-index: 100;
      background: var(--card-bg);
      border: 3px solid var(--border);
      box-shadow: 4px 4px 0 var(--border);
      padding: 8px;
      gap: 8px;
      animation: spawnAnim 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .reaction-overlay.active {
      display: flex;
    }
  </style>

</head>
<body>

  <!-- Ambient Particle Animation Canvas -->
  <canvas id="particleCanvas"></canvas>

  <div class="app-container">
    <!-- Header Box -->
    <div class="header-box">
      <div class="top-actions">
        <button class="icon-btn" title="Export Data" onclick="exportData()">💾</button>
        <button class="icon-btn" title="Import Data" onclick="triggerImport()">📂</button>
      </div>
      <h1>☕ 8-BIT COFFEO #9</h1>
      <div class="sub-info">
        📅 20-9-2026 | 📍 Phordee Cafe<br>
        ⚜️ ຫົວຂໍ້: ແລກປ່ຽນບັນຫາທຸລະກິດ
      </div>

      <!-- Direct WhatsApp Link Button -->
      <a href="https://chat.whatsapp.com/LRSD5mpQqkg9h2YRviw28N?s=qs&p=i&mlu=4&amv=2" target="_blank" class="whatsapp-btn">
        💬 OPEN WHATSAPP GROUP
      </a>
    </div>

    <!-- Hidden File Input for Data Import -->
    <input type="file" id="importFileInput" accept=".json" style="display:none;" onchange="importData(event)">

    <!-- Controls & Filter Chips Bar -->
    <div class="controls">
      <button class="btn add-btn" onclick="openAddModal()">+ ADD MEMBER</button>

      <div class="filter-bar">
        <div class="filter-chip active" onclick="setFilter('ALL', this)">ALL</div>
        <div class="filter-chip" onclick="setFilter('⭐', this)">⭐ Star</div>
        <div class="filter-chip" onclick="setFilter('❤️', this)">❤️ Love</div>
        <div class="filter-chip" onclick="setFilter('👍', this)">👍 Like</div>
        <div class="filter-chip" onclick="setFilter('👀', this)">👀 Watching</div>
      </div>
    </div>

    <!-- Member Cards Grid -->
    <div class="member-grid" id="memberGrid"></div>
  </div>

  <!-- Context Reaction Bar (Tap & Hold) -->
  <div class="reaction-overlay" id="reactionOverlay">
    <span class="reaction-btn" onclick="setQuickStatus('⭐')">⭐</span>
    <span class="reaction-btn" onclick="setQuickStatus('❤️')">❤️</span>
    <span class="reaction-btn" onclick="setQuickStatus('👍')">👍</span>
    <span class="reaction-btn" onclick="setQuickStatus('👀')">👀</span>
    <span class="reaction-btn" onclick="setQuickStatus('')">❌</span>
  </div>

  <!-- Member Detail / Edit Modal -->
  <div class="modal-overlay" id="modalOverlay">
    <div class="modal">
      <h2 id="modalTitle">EDIT MEMBER</h2>
      <input type="hidden" id="editIndex">
      
      <label>Name:</label>
      <input type="text" id="editName" placeholder="Name">
      
      <label>Phone Number:</label>
      <input type="tel" id="editPhone" placeholder="+856 20...">
      
      <label>Social / WhatsApp Link:</label>
      <input type="text" id="editLink" placeholder="https://...">

      <label>Status Tag:</label>
      <div class="action-row">
        <button class="reaction-btn" onclick="selectStatus('⭐')">⭐</button>
        <button class="reaction-btn" onclick="selectStatus('❤️')">❤️</button>
        <button class="reaction-btn" onclick="selectStatus('👍')">👍</button>
        <button class="reaction-btn" onclick="selectStatus('👀')">👀</button>
      </div>

      <label>Move Position:</label>
      <div class="action-row">
        <button class="btn" style="flex:1;" onclick="movePosition('UP')">⬆ UP</button>
        <button class="btn" style="flex:1;" onclick="movePosition('DOWN')">⬇ DOWN</button>
        <button class="btn" style="flex:1; background:var(--yellow);" onclick="movePosition('TOP')">🔝 TOP</button>
      </div>

      <label>Notes / Tags:</label>
      <textarea id="editNotes" rows="3" placeholder="Add custom notes here..."></textarea>

      <div style="display:flex; gap:8px; margin-top:8px;">
        <button class="btn" style="background:var(--red)" onclick="deleteMember()">DELETE</button>
        <button class="btn" onclick="closeModal()">CANCEL</button>
        <button class="btn" style="background:#A9DFBF" onclick="saveMember()">SAVE</button>
      </div>
    </div>
  </div>

  <script>
    // Pre-loaded Lao WhatsApp attendee list
    const defaultList = [
      "ທຽນ", "ຄຳສອນ", "ວົງ", "ນູ່", "ນ້ອຍ", "ສັກ", "ນ້າ", "ບຸ້ຍ", "ໂຊ້", "ຮຸ່ຍ",
      "แม่ทิพย์", "ນໍ້າເຜິ້ງ", "ເຢຍ", "ສົມໄຈ", "ເລ້", "ສົມພອນ", "ຕູ່", "ແອ", "ປາຍ", "ນ້ອຍ",
      "ໂບ", "ມ່ອງ", "ໄກສອນ", "ກຽດສຸວັນ", "ສົມັຍິງ", "ອິມ ຂໍເຂົ້າຮ່ວມນຳ", "leygodlike", "dola", "ແຄັດຕີ້"
    ];

    let members = [];
    let activeFilter = 'ALL';
    let holdTimer = null;
    let selectedMemberIndex = null;

    // Ambient Particle Background Canvas Animation
    const canvas = document.getElementById('particleCanvas');
    const ctx = canvas.getContext('2d');
    let particles = [];

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    class PixelParticle {
      constructor() {
        this.x = Math.random() * canvas.width;
        this.y = Math.random() * canvas.height;
        this.size = Math.floor(Math.random() * 4) + 2;
        this.speedY = -(Math.random() * 0.4 + 0.1);
        this.opacity = Math.random() * 0.5 + 0.2;
      }
      update() {
        this.y += this.speedY;
        if (this.y < -10) {
          this.y = canvas.height + 10;
          this.x = Math.random() * canvas.width;
        }
      }
      draw() {
        ctx.fillStyle = `rgba(141, 91, 76, ${this.opacity})`;
        ctx.fillRect(this.x, this.y, this.size, this.size);
      }
    }

    function initParticles() {
      particles = [];
      for (let i = 0; i < 30; i++) {
        particles.push(new PixelParticle());
      }
    }

    function animateParticles() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      particles.forEach(p => {
        p.update();
        p.draw();
      });
      requestAnimationFrame(animateParticles);
    }
    initParticles();
    animateParticles();

    // Data Management
    function initData() {
      const localData = localStorage.getItem('coffeo_members_data');
      if (localData) {
        members = JSON.parse(localData);
      } else {
        members = defaultList.map((name, idx) => ({
          id: idx + 1,
          name: name,
          phone: '',
          link: '',
          notes: '',
          status: '',
          avatar: `https://api.dicebear.com/7.x/pixel-art/svg?seed=${encodeURIComponent(name)}`
        }));
        saveToLocal();
      }
      render();
    }

    function saveToLocal() {
      localStorage.setItem('coffeo_members_data', JSON.stringify(members));
    }

    // Backup Export & Import
    function exportData() {
      const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(members, null, 2));
      const downloadAnchor = document.createElement('a');
      downloadAnchor.setAttribute("href", dataStr);
      downloadAnchor.setAttribute("download", `8bit_coffeo_backup_${new Date().toISOString().slice(0,10)}.json`);
      document.body.appendChild(downloadAnchor);
      downloadAnchor.click();
      downloadAnchor.remove();
    }

    function triggerImport() {
      document.getElementById('importFileInput').click();
    }

    function importData(event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(e) {
        try {
          const imported = JSON.parse(e.target.result);
          if (Array.isArray(imported)) {
            members = imported;
            saveToLocal();
            render();
            alert('Import successful!');
          } else {
            alert('Invalid data format!');
          }
        } catch (err) {
          alert('Failed to parse backup JSON file!');
        }
      };
      reader.readAsText(file);
      event.target.value = '';
    }

    // Filter Chips
    function setFilter(filterType, element) {
      activeFilter = filterType;
      document.querySelectorAll('.filter-chip').forEach(chip => chip.classList.remove('active'));
      element.classList.add('active');
      render();
    }

    function render() {
      const grid = document.getElementById('memberGrid');
      grid.innerHTML = '';

      members.forEach((m, index) => {
        if (activeFilter !== 'ALL' && m.status !== activeFilter) return;

        const card = document.createElement('div');
        card.className = 'card';
        card.innerHTML = `
          <div class="badge-icon">${m.status || ''}</div>
          <img class="avatar" src="${m.avatar}" alt="pixel-art">
          <div class="member-num">#${index + 1}</div>
          <div class="member-name">${m.name}</div>
        `;

        // Touch & Hold Logic
        card.addEventListener('touchstart', (e) => startHold(e, card, index), {passive: true});
        card.addEventListener('touchend', () => endHold(card));
        card.addEventListener('touchmove', () => endHold(card));

        // Click / Tap Action
        card.addEventListener('click', () => {
          if (!card.dataset.longPressed) {
            openEditModal(index);
          }
          delete card.dataset.longPressed;
        });

        grid.appendChild(card);
      });
    }

    function startHold(e, cardElement, index) {
      selectedMemberIndex = index;
      cardElement.classList.add('holding');
      holdTimer = setTimeout(() => {
        cardElement.dataset.longPressed = "true";
        cardElement.classList.remove('holding');
        showReactionOverlay(e);
      }, 450);
    }

    function endHold(cardElement) {
      clearTimeout(holdTimer);
      if (cardElement) cardElement.classList.remove('holding');
    }

    function showReactionOverlay(e) {
      const overlay = document.getElementById('reactionOverlay');
      const touch = e.touches ? e.touches[0] : e;
      overlay.style.top = `${Math.max(10, touch.clientY - 50)}px`;
      overlay.style.left = `${Math.min(touch.clientX - 80, window.innerWidth - 200)}px`;
      overlay.classList.add('active');
    }

    function setQuickStatus(statusIcon) {
      if (selectedMemberIndex !== null) {
        members[selectedMemberIndex].status = statusIcon;
        saveToLocal();
        render();
      }
      document.getElementById('reactionOverlay').classList.remove('active');
    }

    // Modal Operations
    function openEditModal(index) {
      selectedMemberIndex = index;
      const m = members[index];
      document.getElementById('editIndex').value = index;
      document.getElementById('editName').value = m.name;
      document.getElementById('editPhone').value = m.phone || '';
      document.getElementById('editLink').value = m.link || '';
      document.getElementById('editNotes').value = m.notes || '';
      document.getElementById('modalTitle').innerText = `EDIT MEMBER #${index + 1}`;
      document.getElementById('modalOverlay').classList.add('active');
    }

    function openAddModal() {
      selectedMemberIndex = null;
      document.getElementById('editIndex').value = '';
      document.getElementById('editName').value = '';
      document.getElementById('editPhone').value = '';
      document.getElementById('editLink').value = '';
      document.getElementById('editNotes').value = '';
      document.getElementById('modalTitle').innerText = 'ADD NEW MEMBER';
      document.getElementById('modalOverlay').classList.add('active');
    }

    function closeModal() {
      document.getElementById('modalOverlay').classList.remove('active');
    }

    function selectStatus(icon) {
      if (selectedMemberIndex !== null) {
        members[selectedMemberIndex].status = icon;
      }
    }

    function movePosition(direction) {
      if (selectedMemberIndex === null) return;
      const idx = selectedMemberIndex;

      if (direction === 'UP' && idx > 0) {
        const temp = members[idx];
        members[idx] = members[idx - 1];
        members[idx - 1] = temp;
        selectedMemberIndex = idx - 1;
      } else if (direction === 'DOWN' && idx < members.length - 1) {
        const temp = members[idx];
        members[idx] = members[idx + 1];
        members[idx + 1] = temp;
        selectedMemberIndex = idx + 1;
      } else if (direction === 'TOP' && idx > 0) {
        const item = members.splice(idx, 1)[0];
        members.unshift(item);
        selectedMemberIndex = 0;
      }

      saveToLocal();
      render();
      document.getElementById('modalTitle').innerText = `EDIT MEMBER #${selectedMemberIndex + 1}`;
    }

    function saveMember() {
      const name = document.getElementById('editName').value.trim();
      if (!name) return alert('Name is required!');

      const phone = document.getElementById('editPhone').value;
      const link = document.getElementById('editLink').value;
      const notes = document.getElementById('editNotes').value;

      if (selectedMemberIndex !== null) {
        members[selectedMemberIndex].name = name;
        members[selectedMemberIndex].phone = phone;
        members[selectedMemberIndex].link = link;
        members[selectedMemberIndex].notes = notes;
      } else {
        members.push({
          id: members.length + 1,
          name: name,
          phone: phone,
          link: link,
          notes: notes,
          status: '',
          avatar: `https://api.dicebear.com/7.x/pixel-art/svg?seed=${encodeURIComponent(name)}`
        });
      }

      saveToLocal();
      closeModal();
      render();
    }

    function deleteMember() {
      if (selectedMemberIndex !== null && confirm('Delete this member?')) {
        const cards = document.querySelectorAll('.card');
        if (cards[selectedMemberIndex]) {
          cards[selectedMemberIndex].classList.add('removing');
          setTimeout(() => {
            members.splice(selectedMemberIndex, 1);
            saveToLocal();
            closeModal();
            render();
          }, 280);
        } else {
          members.splice(selectedMemberIndex, 1);
          saveToLocal();
          closeModal();
          render();
        }
      }
    }

    // Dismiss floating context menu on tap outside
    window.addEventListener('touchstart', (e) => {
      if (!e.target.closest('#reactionOverlay') && !e.target.closest('.card')) {
        document.getElementById('reactionOverlay').classList.remove('active');
      }
    });

    // PWA Service Worker Registration
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        const swCode = `
          self.addEventListener('install', e => e.waitUntil(caches.open('8bit-coffeo-v1').then(c => c.addAll(['./']))));
          self.addEventListener('fetch', e => e.respondWith(caches.match(e.request).then(r => r || fetch(e.request))));
        `;
        const blob = new Blob([swCode], {type: 'application/javascript'});
        navigator.serviceWorker.register(URL.createObjectURL(blob)).catch(() => {});
      });
    }

    initData();
  </script>
</body>
</html>
