<!DOCTYPE html>
<html lang="lo">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard ບັນທຶກການຂາຍ - ຢານວດດີເສັ້ນ</title>
    <!-- ດຶງ Font ລາວ "Noto Sans Lao" ມາໃຊ້ -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Lao:wght@300;400;500;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary-color: #2e7d32; /* ສີຂຽວເຂັ້ມ ສື່ເຖິງຢາສະໝຸນໄພ */
            --primary-light: #e8f5e9;
            --secondary-color: #43a047;
            --text-color: #333;
            --bg-color: #f4f6f8;
            --white: #ffffff;
            --danger-color: #e53935;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Noto Sans Lao', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        /* Header */
        header {
            background-color: var(--primary-color);
            color: var(--white);
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header h1 {
            font-size: 24px;
        }

        /* Summary Cards */
        .metrics-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }

        .card {
            background-color: var(--white);
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            border-left: 5px solid var(--primary-color);
        }

        .card h3 {
            font-size: 14px;
            color: #666;
            margin-bottom: 10px;
        }

        .card .value {
            font-size: 24px;
            font-weight: bold;
            color: var(--primary-color);
        }

        /* Main Content Layout */
        .main-content {
            display: grid;
            grid-template-columns: 1fr 2fr;
            gap: 20px;
        }

        @media (max-width: 768px) {
            .main-content {
                grid-template-columns: 1fr;
            }
        }

        /* Form & Section Box */
        .section-box {
            background-color: var(--white);
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }

        .section-box h2 {
            font-size: 18px;
            margin-bottom: 15px;
            color: var(--primary-color);
            border-bottom: 2px solid var(--primary-light);
            padding-bottom: 8px;
        }

        /* Form styling */
        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: 500;
        }

        .form-group input, .form-group select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 14px;
        }

        .form-group input:focus, .form-group select:focus {
            outline: none;
            border-color: var(--primary-color);
        }

        .btn {
            background-color: var(--primary-color);
            color: var(--white);
            border: none;
            padding: 12px 20px;
            border-radius: 5px;
            cursor: pointer;
            width: 100%;
            font-size: 16px;
            font-weight: bold;
            transition: background 0.3s;
        }

        .btn:hover {
            background-color: var(--secondary-color);
        }

        /* Table styling */
        .table-responsive {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }

        table th, table td {
            padding: 12px 10px;
            text-align: left;
            border-bottom: 1px solid #eee;
            font-size: 14px;
        }

        table th {
            background-color: var(--primary-light);
            color: var(--primary-color);
        }

        .btn-delete {
            background-color: var(--danger-color);
            color: white;
            border: none;
            padding: 5px 10px;
            border-radius: 3px;
            cursor: pointer;
            font-size: 12px;
        }

        .badge-transfer {
            background-color: #e3f2fd;
            color: #1976d2;
            padding: 3px 8px;
            border-radius: 12px;
            font-size: 12px;
        }

        .badge-cash {
            background-color: #e8f5e9;
            color: #2e7d32;
            padding: 3px 8px;
            border-radius: 12px;
            font-size: 12px;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Header -->
        <header>
            <h1>🌿 ລະບົບບັນທຶກການຂາຍ - ຢານວດດີເສັ້ນ</h1>
            <span id="current-date"></span>
        </header>

        <!-- Metrics Dashboard Cards -->
        <div class="metrics-grid">
            <div class="card">
                <h3>ຍອດຂາຍລວມທັງໝົດ</h3>
                <div class="value" id="total-revenue">0 ກີບ</div>
            </div>
            <div class="card">
                <h3>ຈຳນວນທີ່ຂາຍໄດ້ລວມ</h3>
                <div class="value" id="total-qty">0 ຫຼອດ</div>
            </div>
            <div class="card">
                <h3>ຈຳນວນອໍເດີ້/ລາຍການ</h3>
                <div class="value" id="total-orders">0 ລາຍການ</div>
            </div>
        </div>

        <!-- Main Content -->
        <div class="main-content">
            
            <!-- Sales Entry Form -->
            <div class="section-box">
                <h2>📝 ບັນທຶກການຂາຍໃໝ່</h2>
                <form id="sales-form">
                    <div class="form-group">
                        <label for="customer-name">ຊື່ລູກຄ້າ:</label>
                        <input type="text" id="customer-name" placeholder="ປ້ອນຊື່ລູກຄ້າ..." required>
                    </div>

                    <div class="form-group">
                        <label for="quantity">ຈຳນວນ (ຫຼອດ):</label>
                        <input type="number" id="quantity" min="1" value="1" required oninput="calculateTotal()">
                    </div>

                    <div class="form-group">
                        <label for="price-per-unit">ລາຄາຕໍ່ຫຼອດ (ກີບ):</label>
                        <input type="number" id="price-per-unit" value="50000" min="0" required oninput="calculateTotal()">
                    </div>

                    <div class="form-group">
                        <label for="total-price">ລາຄາລວມ (ກີບ):</label>
                        <input type="number" id="total-price" value="50000" readonly style="background-color: #e9ecef;">
                    </div>

                    <div class="form-group">
                        <label for="payment-method">ວິທີການຈ່າຍເງິນ:</label>
                        <select id="payment-method">
                            <option value="ໂອນເງິນ (BCEL One)">ໂອນເງິນ (BCEL One)</option>
                            <option value="ເງິນສົດ">ເງິນສົດ</option>
                        </select>
                    </div>

                    <button type="submit" class="btn">💾 ບັນທຶກຂໍ້ມູນ</button>
                </form>
            </div>

            <!-- Sales History Table -->
            <div class="section-box">
                <h2>📋 ປະວັດການຂາຍ</h2>
                <div class="table-responsive">
                    <table>
                        <thead>
                            <tr>
                                <th>ວັນທີ/ເວລາ</th>
                                <th>ຊື່ລູກຄ້າ</th>
                                <th>ຈຳນວນ</th>
                                <th>ລາຄາລວມ</th>
                                <th>ການຈ່າຍ</th>
                                <th>ຈັດການ</th>
                            </tr>
                        </thead>
                        <tbody id="sales-table-body">
                            <!-- ຂໍ້ມູນຈະຖືກເພີ່ມໃສ່ບ່ອນນີ້ດ້ວຍ JS -->
                        </tbody>
                    </table>
                </div>
            </div>

        </div>
    </div>

    <script>
        // ດຶງຂໍ້ມູນຈາກ LocalStorage ຫຼື ສ້າງ Array ຫວ່າງ
        let salesData = JSON.parse(localStorage.getItem('massageOilSalesData')) || [];

        // ສະແດງວັນທີປັດຈຸບັນ
        document.getElementById('current-date').innerText = new Date().toLocaleDateString('lo-LA', {
            year: 'numeric', month: 'long', day: 'numeric'
        });

        // ຟັງຊັນ ຄິດໄລ່ລາຄາລວມອັດໂນມັດ
        function calculateTotal() {
            const qty = parseFloat(document.getElementById('quantity').value) || 0;
            const price = parseFloat(document.getElementById('price-per-unit').value) || 0;
            document.getElementById('total-price').value = qty * price;
        }

        // ຟັງຊັນ ບັນທຶກຂໍ້ມູນ
        document.getElementById('sales-form').addEventListener('submit', function(e) {
            e.preventDefault();

            const customerName = document.getElementById('customer-name').value;
            const quantity = parseInt(document.getElementById('quantity').value);
            const pricePerUnit = parseFloat(document.getElementById('price-per-unit').value);
            const totalPrice = parseInt(document.getElementById('total-price').value);
            const paymentMethod = document.getElementById('payment-method').value;
            
            const now = new Date();
            const dateTimeStr = `${now.toLocaleDateString('lo-LA')} ${now.toLocaleTimeString('lo-LA', {hour: '2-digit', minute:'2-digit'})}`;

            const newSale = {
                id: Date.now(),
                date: dateTimeStr,
                customer: customerName,
                qty: quantity,
                total: totalPrice,
                payment: paymentMethod
            };

            salesData.unshift(newSale); // ເພີ່ມຂໍ້ມູນໃສ່ທາງໜ້າสุด
            saveAndRender();

            // ລ້າງຟອມ
            document.getElementById('customer-name').value = '';
            document.getElementById('quantity').value = '1';
            calculateTotal();
        });

        // ຟັງຊັນ ລົບລາຍການ
        function deleteSale(id) {
            if(confirm('ທ່ານຕ້ອງການລົບລາຍການນີ້ແທ້ບໍ?')) {
                salesData = salesData.filter(item => item.id !== id);
                saveAndRender();
            }
        }

        // ຟັງຊັນ ບັນທຶກລົງ LocalStorage ແລະ ອັບເດດໜ້າຈໍ
        function saveAndRender() {
            localStorage.setItem('massageOilSalesData', JSON.stringify(salesData));
            renderTable();
            renderMetrics();
        }

        // ຟັງຊັນ ສະແດງຕາຕະລາງ
        function renderTable() {
            const tbody = document.getElementById('sales-table-body');
            tbody.innerHTML = '';

            if (salesData.length === 0) {
                tbody.innerHTML = `<tr><td colspan="6" style="text-align:center; color:#888;">ບໍ່ມີຂໍ້ມູນການຂາຍ</td></tr>`;
                return;
            }

            salesData.forEach(sale => {
                const badgeClass = sale.payment.includes('ໂອນ') ? 'badge-transfer' : 'badge-cash';
                const row = document.createElement('tr');
                row.innerHTML = `
                    <td>${sale.date}</td>
                    <td><b>${sale.customer}</b></td>
                    <td>${sale.qty} ຫຼອດ</td>
                    <td><b>${sale.total.toLocaleString()} ກີບ</b></td>
                    <td><span class="${badgeClass}">${sale.payment}</span></td>
                    <td><button class="btn-delete" onclick="deleteSale(${sale.id})">ລົບ</button></td>
                `;
                tbody.appendChild(row);
            });
        }

        // ຟັງຊັນ ອັບເດດ Dashboard (Metrics)
        function renderMetrics() {
            const totalRevenue = salesData.reduce((sum, item) => sum + item.total, 0);
            const totalQty = salesData.reduce((sum, item) => sum + item.qty, 0);
            const totalOrders = salesData.length;

            document.getElementById('total-revenue').innerText = totalRevenue.toLocaleString() + ' ກີບ';
            document.getElementById('total-qty').innerText = totalQty.toLocaleString() + ' ຫຼອດ';
            document.getElementById('total-orders').innerText = totalOrders.toLocaleString() + ' ລາຍການ';
        }

        // ໂຫຼດຂໍ້ມູນຄັ້ງທຳອິດເມື່ອເປີດໜ້າເວັບ
        saveAndRender();
    </script>
</body>
</html>
